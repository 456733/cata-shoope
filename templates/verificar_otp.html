<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Correo - Cata Shoope</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo_cata.png') }}" type="image/png">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#fff0f5,#fff);">
    <div style="background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); padding:48px; max-width:420px; width:90%; text-align:center;">
        <img src="{{ url_for('static', filename='images/logo_cata.png') }}" alt="Cata Shoope" style="height:60px; width:auto; mix-blend-mode:multiply; margin-bottom:16px;">
        <h2 style="font-size:1.5rem; margin-bottom:8px;">Verifica tu correo</h2>
        <p style="color:#666; font-size:0.9rem; margin-bottom:32px;">Hemos enviado un código de 6 dígitos a <strong>{{ email }}</strong></p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for cat, msg in messages %}
            <div style="background:#fff0f0; color:#e53935; padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:0.85rem; text-align:left;">{{ msg }}</div>
            {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('verificar_otp') }}">
            <div style="margin-bottom:24px;">
                <input type="text" name="otp" required placeholder="000000" maxlength="6" style="width:100%; padding:16px; border:2px dashed #ddd; border-radius:10px; font-size:1.5rem; font-weight:bold; letter-spacing:8px; text-align:center; outline:none; color:var(--pink);" onfocus="this.style.borderColor='var(--pink)'" onblur="this.style.borderColor='#ddd'">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; border-radius:10px; font-size:1rem;">Verificar y Continuar</button>
        </form>

        <div style="margin-top:24px;">
            <a href="{{ url_for('login') }}" style="color:#888; font-size:0.85rem; text-decoration:underline;">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
