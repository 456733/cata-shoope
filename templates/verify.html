{% extends 'base.html' %}
{% block title %}Verificar Cuenta - Cata Shoope{% endblock %}
{% block content %}
<section style="padding:120px 5% 60px; max-width:500px; margin:0 auto; text-align:center;">
    <div style="background:#fff; padding:40px; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.08);">
        <a href="{{ url_for('index') }}" class="nav-logo" style="display:block;margin-bottom:24px;font-size:1.8rem;">Cata Shoope</a>
        <h2 style="margin-bottom:8px;">Verifica tu cuenta</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:24px;">Ingresa el codigo de verificacion que enviamos a tu email</p>
        <form method="POST">
            <input type="text" name="code" maxlength="6" placeholder="Codigo de 6 digitos" style="width:100%; padding:16px; border:2px solid #ddd; border-radius:12px; text-align:center; font-size:1.5rem; font-weight:700; letter-spacing:8px; margin-bottom:24px;" required>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; border-radius:12px;">Verificar</button>
        </form>
        <p style="margin-top:16px; font-size:0.85rem; color:#888;">No recibiste el codigo? <a href="#" style="color:var(--pink); font-weight:600;">Reenviar</a></p>
    </div>
</section>
{% endblock %}
