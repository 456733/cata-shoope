<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Cata Shoope</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo_cata.png') }}" type="image/png">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#fff0f5,#fff);">
    <div style="background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); padding:48px; max-width:420px; width:90%;">
        <div style="text-align:center; margin-bottom:32px;">
            <img src="{{ url_for('static', filename='images/logo_cata.png') }}" alt="Cata Shoope" style="height:60px; width:auto; mix-blend-mode:multiply;">
            <h2 style="margin-top:12px; font-size:1.5rem;">Crea una nueva contraseña</h2>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for cat, msg in messages %}
            <div style="background:#fff0f0; color:#e53935; padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:0.85rem;">{{ msg }}</div>
            {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('restablecer_password', token=token) }}">
            <div style="margin-bottom:16px;">
                <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; color:#333;">Nueva Contraseña</label>
                <input type="password" name="password" required placeholder="Escribe tu nueva contraseña" style="width:100%; padding:12px 16px; border:1px solid #ddd; border-radius:10px; font-size:0.95rem; outline:none; transition:border 0.2s;" onfocus="this.style.borderColor='var(--pink)'" onblur="this.style.borderColor='#ddd'">
            </div>
            <div style="margin-bottom:24px;">
                <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; color:#333;">Confirmar Nueva Contraseña</label>
                <input type="password" name="password_confirm" required placeholder="Repite tu nueva contraseña" style="width:100%; padding:12px 16px; border:1px solid #ddd; border-radius:10px; font-size:0.95rem; outline:none; transition:border 0.2s;" onfocus="this.style.borderColor='var(--pink)'" onblur="this.style.borderColor='#ddd'">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; border-radius:10px; font-size:1rem;">Guardar y Continuar</button>
        </form>

        <div style="text-align:center; margin-top:24px;">
            <a href="{{ url_for('login') }}" style="color:#888; font-size:0.85rem;">Cancelar y volver al inicio</a>
        </div>
    </div>
</body>
</html>
